<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 882 284" role="img" aria-labelledby="rc-t rc-d" font-family="JetBrains Mono, Consolas, monospace">
<title id="rc-t">Replaying a fixed-code remote versus a rolling-code remote</title>
<desc id="rc-d">Two rows of three steps. Fixed code: the remote sends A7 3F 19 and the receiver opens; the Flipper hears the same A7 3F 19 and saves it; later the Flipper sends A7 3F 19 and the receiver opens again, because the code never changes. Rolling code: the remote sends 5C 9E 02, which carries count 41 encrypted inside, and the receiver opens and from then on only accepts count 42 or later; the Flipper saves 5C 9E 02; when the Flipper replays it, the receiver ignores it because count 41 is already used.</desc>
<rect x="0.5" y="0.5" width="881" height="283" rx="8" fill="#0e0e0e" stroke="#2a2a2a"/>
<g transform="translate(6,0)">
<text x="245" y="22" fill="#8a8a8a" font-size="12" text-anchor="middle">1  press the real remote</text>
<text x="495" y="22" fill="#8a8a8a" font-size="12" text-anchor="middle">2  Flipper records it</text>
<text x="745" y="22" fill="#8a8a8a" font-size="12" text-anchor="middle">3  Flipper replays it</text>
<text x="14" y="82" fill="#e08a3c" font-size="13">FIXED</text>
<text x="14" y="98" fill="#e08a3c" font-size="13">CODE</text>
<text x="14" y="120" fill="#8a8a8a" font-size="11">same code</text>
<text x="14" y="134" fill="#8a8a8a" font-size="11">every press</text>
<rect x="130" y="36" width="230" height="112" rx="6" fill="none" stroke="#3a3a3a"/>
<text x="245" y="56" fill="#8a8a8a" font-size="11" text-anchor="middle">remote sends</text>
<rect x="175" y="64" width="140" height="26" rx="4" fill="#e08a3c" fill-opacity="0.16" stroke="#e08a3c"/>
<text x="245" y="82" fill="#b0b0b0" font-size="14" text-anchor="middle">A7 3F 19</text>
<text x="245" y="124" fill="#8FB65F" font-size="12" text-anchor="middle">receiver opens</text>
<text x="245" y="140" fill="#8a8a8a" font-size="11" text-anchor="middle">it knows this code</text>
<line x1="363" y1="77" x2="371" y2="77" stroke="#8a8a8a"/><polygon points="370,73 377,77 370,81" fill="#8a8a8a"/>
<rect x="380" y="36" width="230" height="112" rx="6" fill="none" stroke="#3a3a3a"/>
<text x="495" y="56" fill="#8a8a8a" font-size="11" text-anchor="middle">Flipper hears it too</text>
<rect x="425" y="64" width="140" height="26" rx="4" fill="#e08a3c" fill-opacity="0.16" stroke="#e08a3c"/>
<text x="495" y="82" fill="#b0b0b0" font-size="14" text-anchor="middle">A7 3F 19</text>
<text x="495" y="124" fill="#8a8a8a" font-size="12" text-anchor="middle">saved as fan-off.sub</text>
<line x1="613" y1="77" x2="621" y2="77" stroke="#8a8a8a"/><polygon points="620,73 627,77 620,81" fill="#8a8a8a"/>
<rect x="630" y="36" width="230" height="112" rx="6" fill="none" stroke="#3a3a3a"/>
<text x="745" y="56" fill="#8a8a8a" font-size="11" text-anchor="middle">Flipper sends</text>
<rect x="675" y="64" width="140" height="26" rx="4" fill="#e08a3c" fill-opacity="0.16" stroke="#e08a3c"/>
<text x="745" y="82" fill="#b0b0b0" font-size="14" text-anchor="middle">A7 3F 19</text>
<text x="745" y="124" fill="#8FB65F" font-size="12" text-anchor="middle">receiver opens</text>
<text x="745" y="140" fill="#8a8a8a" font-size="11" text-anchor="middle">same code, still good</text>
<text x="14" y="206" fill="#5fafaf" font-size="13">ROLLING</text>
<text x="14" y="222" fill="#5fafaf" font-size="13">CODE</text>
<text x="14" y="244" fill="#8a8a8a" font-size="11">new code</text>
<text x="14" y="258" fill="#8a8a8a" font-size="11">every press</text>
<rect x="130" y="160" width="230" height="112" rx="6" fill="none" stroke="#3a3a3a"/>
<text x="245" y="180" fill="#8a8a8a" font-size="11" text-anchor="middle">remote sends</text>
<rect x="175" y="188" width="140" height="26" rx="4" fill="#5fafaf" fill-opacity="0.16" stroke="#5fafaf"/>
<text x="245" y="206" fill="#b0b0b0" font-size="14" text-anchor="middle">5C 9E 02</text>
<text x="245" y="228" fill="#5fafaf" font-size="11" text-anchor="middle">count 41, encrypted inside</text>
<text x="245" y="248" fill="#8FB65F" font-size="12" text-anchor="middle">receiver opens</text>
<text x="245" y="264" fill="#8a8a8a" font-size="11" text-anchor="middle">now wants count 42 or later</text>
<line x1="363" y1="201" x2="371" y2="201" stroke="#8a8a8a"/><polygon points="370,197 377,201 370,205" fill="#8a8a8a"/>
<rect x="380" y="160" width="230" height="112" rx="6" fill="none" stroke="#3a3a3a"/>
<text x="495" y="180" fill="#8a8a8a" font-size="11" text-anchor="middle">Flipper hears it too</text>
<rect x="425" y="188" width="140" height="26" rx="4" fill="#5fafaf" fill-opacity="0.16" stroke="#5fafaf"/>
<text x="495" y="206" fill="#b0b0b0" font-size="14" text-anchor="middle">5C 9E 02</text>
<text x="495" y="228" fill="#5fafaf" font-size="11" text-anchor="middle">count 41</text>
<text x="495" y="248" fill="#8a8a8a" font-size="12" text-anchor="middle">saved</text>
<line x1="613" y1="201" x2="621" y2="201" stroke="#8a8a8a"/><polygon points="620,197 627,201 620,205" fill="#8a8a8a"/>
<rect x="630" y="160" width="230" height="112" rx="6" fill="none" stroke="#3a3a3a"/>
<text x="745" y="180" fill="#8a8a8a" font-size="11" text-anchor="middle">Flipper sends</text>
<rect x="675" y="188" width="140" height="26" rx="4" fill="#5fafaf" fill-opacity="0.16" stroke="#5fafaf"/>
<text x="745" y="206" fill="#b0b0b0" font-size="14" text-anchor="middle">5C 9E 02</text>
<text x="745" y="228" fill="#5fafaf" font-size="11" text-anchor="middle">count 41</text>
<text x="745" y="248" fill="#f85149" font-size="12" text-anchor="middle">receiver ignores it</text>
<text x="745" y="264" fill="#8a8a8a" font-size="11" text-anchor="middle">count 41 is used up</text>
</g>
</svg>
